# Tree-level resolutions record reviewed invariant violations that are not
# simple source-row corrections. They do not edit raw data.
#
# Example:
#
# [[tree_resolutions]]
# kind = "reviewed"
# note = "Reviewed with source sheets; DBH discontinuity is accepted as fallen/decomposing tree evidence."
# tree = { site = "BRNV", plot = "L6", identity_tag = "85" }
# codes = ["max_dbh_jump", "ranked_dbh_jump"]


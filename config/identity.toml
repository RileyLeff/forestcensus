# tag = "508"
# identity_tag = "112"
# effective_from = "2024-05-01"
# note = "Retag: visible tag 508 should resolve to identity 112 from May 2024 forward."
#
# Example for splitting a historical biological individual away from a visible
# field tag while keeping the written datasheet tag unchanged:
#
# [[splits]]
# note = "Old dead tree under visible tag 75 gets its own closed identity."
# source = { site = "BRNV", plot = "L6", identity_tag = "75" }
# target_identity_tag = "75_old_dead_pinus"
# target_identity_label = "L6/75 old dead Pinus"
# selector = { kind = "all", before = "2021-01-01", match = { genus = "Pinus", health_observed = 0 } }
#
# `target_public_tag` and `target_tree_number` are optional. Omit them when the
# datasheet tag should remain visible as written.
